# arachnesentinel.com - tanitim sitesini GitHub Pages'e yayinlar.
# website/ veya build betigi degisince site kendiliginden guncellenir.
name: Tanitim sitesi (GitHub Pages)

on:
  push:
    branches: [master]
    paths:
      - "website/**"
      - "scripts/build_static_site.py"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Bagimliliklar
        run: pip install -r requirements.txt
      - name: Statik siteyi uret
        run: python scripts/build_static_site.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
